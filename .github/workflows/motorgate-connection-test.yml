name: MOTOR GATE 接続テスト

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: MOTOR GATEの通信段階を確認
        shell: bash
        run: |
          python3 - <<'PY'
          import socket
          import ssl
          import http.client
          import time

          host = "motorgate.jp"
          port = 443
          path = "/login/index"
          timeout = 10

          print("=== 1. DNS確認 ===", flush=True)

          try:
              addresses = socket.getaddrinfo(
                  host,
                  port,
                  type=socket.SOCK_STREAM
              )

              ips = sorted(set(
                  item[4][0] for item in addresses
              ))

              print("DNS成功:", ips, flush=True)

          except Exception as e:
              print("DNS失敗:", repr(e), flush=True)
              ips = []

          print("=== 2. TCP 443番ポート確認 ===", flush=True)

          for ip in ips:
              start = time.monotonic()

              try:
                  with socket.create_connection(
                      (ip, port),
                      timeout=timeout
                  ):
                      print(
                          "TCP成功:",
                          ip,
                          "秒数:",
                          round(time.monotonic() - start, 2),
                          flush=True
                      )

              except Exception as e:
                  print(
                      "TCP失敗:",
                      ip,
                      repr(e),
                      "秒数:",
                      round(time.monotonic() - start, 2),
                      flush=True
                  )

          print("=== 3. TLS暗号化通信確認 ===", flush=True)

          for ip in ips:
              start = time.monotonic()

              try:
                  with socket.create_connection(
                      (ip, port),
                      timeout=timeout
                  ) as raw_socket:

                      context = ssl.create_default_context()

                      with context.wrap_socket(
                          raw_socket,
                          server_hostname=host
                      ) as secure_socket:

                          print(
                              "TLS成功:",
                              ip,
                              "方式:",
                              secure_socket.version(),
                              "秒数:",
                              round(time.monotonic() - start, 2),
                              flush=True
                          )

              except Exception as e:
                  print(
                      "TLS失敗:",
                      ip,
                      repr(e),
                      "秒数:",
                      round(time.monotonic() - start, 2),
                      flush=True
                  )

          print("=== 4. HTTPS応答確認 ===", flush=True)

          start = time.monotonic()
          connection = None

          try:
              connection = http.client.HTTPSConnection(
                  host,
                  port=port,
                  timeout=timeout
              )

              connection.request(
                  "GET",
                  path,
                  headers={
                      "User-Agent": "Mozilla/5.0",
                      "Accept": "text/html"
                  }
              )

              response = connection.getresponse()

              print(
                  "HTTPS応答成功:",
                  "HTTP",
                  response.status,
                  "秒数:",
                  round(time.monotonic() - start, 2),
                  flush=True
              )

          except Exception as e:
              print(
                  "HTTPS失敗:",
                  repr(e),
                  "秒数:",
                  round(time.monotonic() - start, 2),
                  flush=True
              )

          finally:
              if connection is not None:
                  connection.close()

          print("=== 接続テスト終了 ===", flush=True)
          PY
