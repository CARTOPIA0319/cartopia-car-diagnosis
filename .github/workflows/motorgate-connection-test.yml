
name: MOTOR GATE 接続テスト

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: MOTOR GATEへの接続確認
        shell: bash
        run: |
          python3 - <<'PY'
          import socket
          import urllib.request
          import urllib.error
          import time

          host = "motorgate.jp"
          url = "https://motorgate.jp/login/index"

          print("=== DNS確認 ===", flush=True)

          try:
              addresses = socket.getaddrinfo(
                  host, 443, type=socket.SOCK_STREAM
              )
              ips = sorted(set(x[4][0] for x in addresses))
              print("DNS成功:", ips, flush=True)
          except Exception as e:
              print("DNS失敗:", repr(e), flush=True)

          print("=== HTTPS接続確認 ===", flush=True)

          for attempt in range(1, 4):
              start = time.monotonic()
              try:
                  req = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "Mozilla/5.0"
                      }
                  )
                  with urllib.request.urlopen(
                      req, timeout=12
                  ) as response:
                      print(
                          f"試行{attempt}: 接続成功",
                          "HTTP", response.status,
                          "秒数",
                          round(time.monotonic() - start, 2),
                          flush=True
                      )
              except urllib.error.HTTPError as e:
                  print(
                      f"試行{attempt}: HTTP応答あり",
                      e.code,
                      flush=True
                  )
              except Exception as e:
                  print(
                      f"試行{attempt}: 接続失敗",
                      repr(e),
                      flush=True
                  )

          print("=== テスト終了 ===", flush=True)
          PY
