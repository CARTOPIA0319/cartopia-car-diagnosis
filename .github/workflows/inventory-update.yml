name: 在庫を分割取得して全件更新

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read

concurrency:
  group: cartopia-inventory-batch
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 最大10台ずつ続きから取得
        env:
          INVENTORY_UPDATE_URL: https://cartopia-car-diagnosis.vercel.app/api/inventory/update?save=1&source=github-actions
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          source = os.environ.get('INVENTORY_UPDATE_URL', '').strip()
          parsed = urllib.parse.urlsplit(source)

          if parsed.scheme != 'https' or not parsed.netloc:
              raise SystemExit(
                  '更新URLが正しくありません。'
              )

          query = dict(
              urllib.parse.parse_qsl(
                  parsed.query,
                  keep_blank_values=True
              )
          )
          query.pop('status', None)
          query.update(
              save='1',
              wait='1',
              source='github-actions'
          )

          url = urllib.parse.urlunsplit(
              parsed._replace(
                  query=urllib.parse.urlencode(query),
                  fragment=''
              )
          )

          deadline = time.monotonic() + 35 * 60
          failures = 0
          result = {}

          while time.monotonic() < deadline:
              remaining = deadline - time.monotonic()

              if remaining < 270:
                  break

              try:
                  request = urllib.request.Request(
                      url,
                      headers={
                          'User-Agent': 'cartopia-inventory-batch',
                          'Cache-Control': 'no-store'
                      }
                  )

                  with urllib.request.urlopen(
                      request,
                      timeout=260
                  ) as response:
                      result = json.load(response)

                  if (
                      result.get('accepted') is False
                      and result.get('running')
                  ):
                      print(
                          '別の更新が実行中です。15秒後に再確認します。',
                          flush=True
                      )
                      time.sleep(15)
                      continue

                  if (
                      result.get('codeVersion')
                      != 'resumable-batch-v14'
                  ):
                      raise SystemExit(
                          '先に修正版route.jsをデプロイしてください。'
                          '旧版への連続呼び出しは停止しました。'
                      )

                  if not result.get('success'):
                      raise RuntimeError(
                          result.get('error', '更新失敗')
                      )

                  if not isinstance(result.get('hasMore'), bool):
                      raise SystemExit(
                          '継続フラグが返りません。'
                          '更新URLとデプロイを確認してください。'
                      )

                  progress = result.get('progress') or {}

                  print(
                      json.dumps(
                          {
                              'processed': result.get('processed'),
                              'progress': progress
                          },
                          ensure_ascii=False
                      ),
                      flush=True
                  )

                  failures = 0

                  if not result['hasMore']:
                      if not result.get('cycleSuccess'):
                          raise SystemExit(
                              '巡回終了。ただし詳細取得失敗があります。'
                              'status=1のfailedStockIdsを確認してください。'
                          )

                      print('全件更新完了', flush=True)
                      break

                  time.sleep(5)

              except (
                  urllib.error.URLError,
                  TimeoutError,
                  OSError,
                  ValueError,
                  RuntimeError
              ) as error:
                  failures += 1

                  print(
                      f'通信または更新に失敗'
                      f'（{type(error).__name__}、連続{failures}回）。'
                      '確定保存済み分は保持されます。',
                      flush=True
                  )

                  if failures >= 3:
                      raise SystemExit(
                          '連続3回失敗しました。'
                          '次回定期実行で再開します。'
                          'status=1で失敗段階を確認してください。'
                      )

                  time.sleep(15)

          else:
              raise SystemExit(
                  '実行時間上限。'
                  '次回定期実行で保存済みの続きから再開します。'
              )

          if (
              time.monotonic() >= deadline - 270
              and result.get('hasMore', True)
          ):
              raise SystemExit(
                  '実行時間上限。次回定期実行で再開します。'
              )
          PY
